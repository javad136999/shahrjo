# ShahrJo - reverse proxy (reference config).
# Production currently runs behind the existing Caddy for shahrju.ir
# (see comments in docker-compose.prod.yml); the self-hosted alternative is
# the compose `nginx` profile rendered from docker/nginx/templates/.
# This file mirrors the SAME real endpoints, so it can be used standalone:
#   shahrju.ir        -> web  (Next.js :3000, admin panel at /admin)
#   api.shahrju.ir    -> api  (NestJS :4000, prefix /api/v1)
# HTTP -> HTTPS redirect is handled by certbot (docs/deploy.md §3).

upstream shahrjo_web  { server web:3000;  }
upstream shahrjo_api  { server api:4000;  }

server {
    listen 80;
    server_name shahrju.ir www.shahrju.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shahrju.ir www.shahrju.ir;

    # ssl_certificate     /etc/letsencrypt/live/shahrju.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shahrju.ir/privkey.pem;

    client_max_body_size 20m; # ad/business images

    location /_next/static/ {
        proxy_pass http://shahrjo_web;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://shahrjo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.shahrju.ir;

    # ssl_certificate     /etc/letsencrypt/live/shahrju.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shahrju.ir/privkey.pem;

    client_max_body_size 20m;

    # Uploaded files — real path /api/v1/files/* (the API sets its own
    # immutable Cache-Control; forwarded untouched). No /socket.io/ block:
    # no WebSocket service exists, the city wall polls over HTTP every 5s.
    location /api/v1/files/ {
        proxy_pass http://shahrjo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://shahrjo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.shahrju.ir;

    # The admin panel is a route of the web app (apps/web/src/app/admin),
    # there is no separate admin service — redirect to it on the main domain.
    return 301 https://shahrju.ir/admin;
}
