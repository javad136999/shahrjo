# ShahrJo - reverse proxy (production, Phase 13/14 will wire certbot + compose).
# HTTP -> HTTPS redirect is handled by certbot; here we define upstreams + TLS.

upstream shahrjo_web  { server web:3000;  }
upstream shahrjo_api  { server api:4000;  }
upstream shahrjo_admin { server admin:3002; }

server {
    listen 80;
    server_name shahrjo.ir www.shahrjo.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shahrjo.ir www.shahrjo.ir;

    # ssl_certificate     /etc/letsencrypt/live/shahrjo.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shahrjo.ir/privkey.pem;

    client_max_body_size 20m; # ad/business images

    location /_next/static/ {
        proxy_pass http://shahrjo_web;
        proxy_cache_valid 200 365d;
    }
    location / {
        proxy_pass http://shahrjo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.shahrjo.ir;

    # ssl_certificate     /etc/letsencrypt/live/shahrjo.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shahrjo.ir/privkey.pem;

    client_max_body_size 20m;

    # WebSocket (public city chat)
    location /socket.io/ {
        proxy_pass http://shahrjo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Static uploads (served by API storage driver)
    location /files/ {
        proxy_pass http://shahrjo_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://shahrjo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.shahrjo.ir;

    # ssl_certificate     /etc/letsencrypt/live/shahrjo.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shahrjo.ir/privkey.pem;

    location / {
        proxy_pass http://shahrjo_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
