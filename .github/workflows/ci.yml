# ShahrJo CI - runs on every push / PR:
#   1) checks:    structure check + prisma validate + typecheck + tests (when present)
#   2) database:  migrations + seed against a clean PostgreSQL 17
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Structure / TypeCheck / Tests
    runs-on: ubuntu-latest
    # prisma validate/generate resolve env("DATABASE_URL") at config load time,
    # so even non-DB steps need it defined (no .env file exists on the runner).
    env:
      DATABASE_URL: postgresql://shahrjo:ci_strong_password@localhost:5432/shahrjo?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Phase checks (structure + secret scan + prisma validate + typecheck)
        run: pnpm verify:phase1

      - name: Phase 2 checks (auth structure + security invariants)
        run: pnpm verify:phase2

      - name: Phase 3 checks (city selection frontend + validated cityId)
        run: pnpm verify:phase3

      - name: Phase 4 checks (city dashboard feeds + moderation filters)
        run: pnpm verify:phase4

      - name: Phase 5 checks (ad submission + upload security)
        run: pnpm verify:phase5

      - name: Typecheck all workspaces
        run: pnpm typecheck:all

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Tests
        run: pnpm run --if-present test

  database:
    name: Migration + Seed (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shahrjo
          POSTGRES_PASSWORD: ci_strong_password
          POSTGRES_DB: shahrjo
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://shahrjo:ci_strong_password@localhost:5432/shahrjo?schema=public
      REDIS_URL: redis://localhost:6379
      # The API refuses to boot without these (assertRequiredEnv in main.ts).
      JWT_ACCESS_SECRET: ci_access_secret_not_a_real_key_00000000000000000000000000
      JWT_REFRESH_SECRET: ci_refresh_secret_not_a_real_key_0000000000000000000000000
      OTP_HASH_SECRET: ci_otp_hash_secret_not_a_real_key_00000000000000000000000000
      SMS_PROVIDER: console
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a clean database
        run: pnpm db:deploy

      - name: Seed reference data
        run: pnpm db:seed

      - name: Build API
        run: pnpm --filter @shahrjo/api build

      - name: "Smoke test (full auth flow: OTP -> tokens -> refresh -> logout)"
        run: pnpm smoke
