# Temporary helper for the feat/legal-pages PR. Opens the PR (if the repo allows
# Actions to do so, otherwise waits for the maintainer to open it), waits until
# CI is green, merges, then removes this file from main. Trigger is limited to
# pushes on this branch; it exists only because no GitHub API token is
# available in the workspace.
name: PR automation (legal pages)
on:
  push:
    branches: [feat/legal-pages]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pr-automation
  cancel-in-progress: false
jobs:
  open-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Create or adopt PR, wait for CI, merge, remove helper
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const head = 'feat/legal-pages';
            const base = 'main';

            // Phase A (max ~10 min): find a PR for this branch, or create one.
            // Creation may be blocked by the repo setting; in that case we keep
            // retrying so the maintainer can open the PR manually meanwhile.
            let pr = null;
            for (let i = 0; i < 30 && !pr; i++) {
              const { data: open } = await github.rest.pulls.list({ owner, repo, state: 'open' });
              pr = open.find((p) => p.head.ref === head && p.base.ref === base) || null;
              if (pr) { core.info('using existing PR #' + pr.number); break; }
              try {
                ({ data: pr } = await github.rest.pulls.create({
                  owner, repo, head, base,
                  title: 'شهرجو: صفحات حریم خصوصی و شرایط استفاده + نماد اینماد در فوتر',
                  body: [
                    '## خلاصه تغییرات',
                    '- صفحه `/privacy`: سیاست حریم خصوصی مبتنی بر رفتار واقعی سامانه',
                    '- صفحه `/terms`: شرایط استفاده + سیاست بازپرداخت محتاطانه مبتنی بر کد زرین‌پال',
                    '- حذف وعده «۷۲ ساعت» بدون پشتوانه از صفحه نتیجه پرداخت',
                    '- لینک‌های فوتر: حریم خصوصی / شرایط استفاده / تماس با ما',
                    '- نماد اعتماد الکترونیکی (اینماد) در فوتر با کد و شناسه دقیق',
                    '',
                    '## بررسی‌ها',
                    '- typecheck وب و API، تست‌ها و `next build`: سبز',
                    '- CI روی کامیت‌های شاخه: success',
                  ].join('\n'),
                }));
                core.info('PR created: ' + pr.html_url);
              } catch (e) {
                core.info('create attempt failed (waiting for manual PR): ' + e.message);
                pr = null;
                await sleep(20000);
              }
            }
            if (!pr) {
              throw new Error(
                'PR could not be created and none was opened within 10 minutes. ' +
                'Fix: enable Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests", ' +
                'or open https://github.com/' + owner + '/' + repo + '/pull/new/' + head + ' manually, then re-run.',
              );
            }

            // Phase B: wait for the *push-event* CI run on this exact SHA.
            const sha = pr.head.sha;
            core.info('gate: waiting for push-event CI on ' + sha);
            // pull_request runs on this branch can sit in `action_required`
            // (bot-created PR) and must neither gate nor satisfy the merge.
            let gated = false;
            for (let i = 0; i < 36 && !gated; i++) {
              const { data: d } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push',
              });
              const run = (d.workflow_runs || []).sort((a, b) => b.id - a.id)[0];
              if (!run) { core.info('CI push run not found yet on ' + sha); await sleep(20000); continue; }
              core.info('CI push run #' + run.run_number + ': ' + run.status + '/' + run.conclusion);
              if (run.status === 'completed') {
                if (run.conclusion === 'success') { gated = true; break; }
                throw new Error('CI failed on ' + sha + ' — see ' + run.html_url);
              }
              await sleep(20000);
            }
            if (!gated) throw new Error('CI did not finish in time on ' + sha);

            // Phase C: merge.
            try {
              const { data: merged } = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'merge',
              });
              core.info('merged: ' + merged.sha);
            } catch (e) {
              throw new Error(
                'CI is green but merge was refused: ' + e.message +
                '. Merge https://github.com/' + owner + '/' + repo + '/pull/' + pr.number + ' manually.',
              );
            }

            // Phase D: remove this helper from main (GITHUB_TOKEN commits do not re-trigger CI).
            try {
              const { data: f } = await github.rest.repos.getContent({
                owner, repo, path: '.github/workflows/pr-automation.yml', ref: base,
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: '.github/workflows/pr-automation.yml', branch: base,
                message: 'chore: remove temporary PR automation helper [skip ci]',
                content: '', sha: f.sha,
              });
              core.info('helper removed from main');
            } catch (e) {
              core.warning('cleanup skipped: ' + e.message);
            }
