name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check required release secrets
        env:
          KEYSTORE_B64: ${{ secrets.SHAHRJO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHAHRJO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHAHRJO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHAHRJO_KEY_PASSWORD }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: |
          missing=0
          for item in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD BAZAAR_RSA_PUBLIC_KEY; do
            if [ -z "${!item}" ]; then
              echo "::error::Required GitHub Actions secret is missing: ${item}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release build stopped. No unsigned or debug APK will be presented as a release."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare and validate signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHAHRJO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHAHRJO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHAHRJO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shahrjo-release.jks"
          test -s "$RUNNER_TEMP/shahrjo-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/shahrjo-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/shahrjo-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK from main
        working-directory: apps/android
        env:
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Align and sign release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.SHAHRJO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHAHRJO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHAHRJO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          INPUT="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$INPUT" ]; then
            echo "::error::Expected release APK not found: $INPUT"
            find apps/android/app/build/outputs/apk -type f -maxdepth 3 || true
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -f 4 "$INPUT" "$RUNNER_TEMP/shahrjo-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_PATH" --ks-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "env:KEY_PASSWORD" --out "$RUNNER_TEMP/shahrjo-release.apk" "$RUNNER_TEMP/shahrjo-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/shahrjo-release.apk" | tee "$RUNNER_TEMP/signature-check.txt"
          echo '### APK signature verification' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/signature-check.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: shahrjo-main-signed-release-apk
          path: ${{ runner.temp }}/shahrjo-release.apk
          if-no-files-found: error
          retention-days: 14
