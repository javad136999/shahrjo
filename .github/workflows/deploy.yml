# Deploy the production VPS using a SELF-HOSTED runner installed on the server.
#
# Production deploys triggered by a push to main wait for the CI workflow to
# finish successfully. Stale CI runs are skipped if main has moved on, so an
# untested commit is never deployed by an older workflow run.
#
# One-time server setup:
#   1. Register a runner with labels: self-hosted + shahrjo-prod
#   2. Install the runner service as a user that can run docker (e.g. deploy).
#   3. Ensure that user can git pull the public repository.
name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    name: Pull · rebuild · migrate · seed · health
    runs-on: [self-hosted, shahrjo-prod]
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/deploy/shahrjo' }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Preflight (user · docker · path)
        run: |
          set -euo pipefail
          echo "whoami=$(whoami) groups=$(groups)"
          docker compose version
          echo "deploy_path=$DEPLOY_PATH"
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "::error::DEPLOY_PATH ($DEPLOY_PATH) is not a git checkout"
            exit 1
          fi

      - name: Select tested commit (skip stale CI runs)
        id: select_commit
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main

          # workflow_dispatch is an explicit manual deployment; otherwise only
          # deploy the exact main commit whose CI workflow completed successfully.
          if [ -n "$TESTED_SHA" ]; then
            MAIN_SHA="$(git rev-parse origin/main)"
            if [ "$MAIN_SHA" != "$TESTED_SHA" ]; then
              echo "main advanced after CI passed; skipping stale deployment."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git checkout main
          git pull --ff-only origin main
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "::error::Checked-out commit differs from the commit that passed CI"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "deploying_sha=$(git rev-parse --short HEAD)"

      - name: Rebuild and start services
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Apply database migrations
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Prisma schema and seed configuration live at /repo, not the API
          # image's default WORKDIR (/repo/apps/api).
          docker compose -f docker-compose.prod.yml exec -T -w /repo api npx prisma migrate deploy
          docker compose -f docker-compose.prod.yml exec -T -w /repo api npx prisma migrate status

      - name: Seed reference data (idempotent upsert)
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml exec -T -w /repo api npx prisma db seed

      - name: Health check
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml ps
          curl -sf http://127.0.0.1/api/v1/health >/dev/null
          echo "DEPLOY OK"
