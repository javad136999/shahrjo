# Auto-deploy the production VPS on every push to main (or manually).
#
# One-time setup → repo Settings → Secrets and variables → Actions:
#   VPS_HOST     server IP / domain        (required)  e.g. 87.107.191.61
#   VPS_SSH_KEY  private key (no passphrase) (required) — public half must be
#                in the SSH user's ~/.ssh/authorized_keys on the server
#   VPS_USER     SSH user                  (optional, default: deploy)
#   VPS_PORT     SSH port                  (optional, default: 22)
#   VPS_PATH     repo checkout on server   (optional, default: /home/deploy/shahrjo)
#
# Then: run this workflow once via the "Run workflow" button (workflow_dispatch),
# or just push/merge to main. GitHub runners reach SSH directly.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel a half-done deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull · rebuild · migrate · seed · health-check
    runs-on: ubuntu-latest
    # Optional gate: create a "production" environment with required reviewers
    # in repo settings to require a manual approval before each deploy.
    environment: production
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deploy' }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH || '/home/deploy/shahrjo' }}"
            echo "==> git pull (main)"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            echo "==> rebuild + up"
            docker compose -f docker-compose.prod.yml up -d --build
            echo "==> migrate"
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy
            echo "==> seed (idempotent upsert: cities, boundaries, coord fixes)"
            docker compose -f docker-compose.prod.yml exec -T api npx prisma db seed
            echo "==> container status"
            docker compose -f docker-compose.prod.yml ps
            echo "==> health check"
            curl -sf http://127.0.0.1/api/v1/health >/dev/null && echo "DEPLOY OK"
