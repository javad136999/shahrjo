# Deploy the production VPS using a SELF-HOSTED runner installed on the server.
#
# Production deploys triggered by a push to main wait for the CI workflow to
# finish successfully. Stale CI runs are skipped if main has moved on, so an
# untested commit is never deployed by an older workflow run.
#
# One-time server setup:
#   1. Register a runner with labels: self-hosted + shahrjo-prod
#   2. Install the runner service as a user that can run docker (e.g. deploy).
#   3. Ensure that user can git pull the public repository.
name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    name: Pull · rebuild · migrate · seed · health
    runs-on: [self-hosted, shahrjo-prod]
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/deploy/shahrjo' }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Preflight (user · docker · path)
        run: |
          set -euo pipefail
          echo "whoami=$(whoami) groups=$(groups)"
          docker compose version
          echo "deploy_path=$DEPLOY_PATH"
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "::error::DEPLOY_PATH ($DEPLOY_PATH) is not a git checkout"
            exit 1
          fi

      - name: Select tested commit (skip stale CI runs)
        id: select_commit
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main

          # workflow_dispatch is an explicit manual deployment; otherwise only
          # deploy the exact main commit whose CI workflow completed successfully.
          if [ -n "$TESTED_SHA" ]; then
            MAIN_SHA="$(git rev-parse origin/main)"
            if [ "$MAIN_SHA" != "$TESTED_SHA" ]; then
              echo "main advanced after CI passed; skipping stale deployment."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Leave non-conflicting untracked server files in place (for example,
          # public verification files). Refuse only if origin/main would overlap.
          mapfile -d '' untracked_paths < <(git ls-files --others --exclude-standard -z)
          mapfile -d '' remote_paths < <(git ls-tree -r -z --name-only origin/main)
          if [ "${#untracked_paths[@]}" -gt 0 ]; then
            echo "Untracked local files (left in place unless conflicting):"
            printf '  %s\n' "${untracked_paths[@]}"
            conflicts=()
            for local_path in "${untracked_paths[@]}"; do
              for remote_path in "${remote_paths[@]}"; do
                if [[ "$local_path" == "$remote_path" || "$local_path" == "$remote_path/"* || "$remote_path" == "$local_path/"* ]]; then
                  conflicts+=("$local_path <-> $remote_path")
                  break
                fi
              done
            done
            if [ "${#conflicts[@]}" -gt 0 ]; then
              echo "::error::Untracked paths conflict with origin/main; refusing to move them."
              printf '%s\n' "${conflicts[@]}"
              exit 1
            fi
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked local changes found; preserving before deployment:"
            git status --short
            git diff --stat HEAD
            umask 077
            backup_dir="$(dirname "$DEPLOY_PATH")/$(basename "$DEPLOY_PATH")-local-change-backups"
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            backup_patch="$backup_dir/pre-deploy-${TESTED_SHA:-manual}-$(date -u +%Y%m%dT%H%M%SZ).patch"
            git diff --binary HEAD > "$backup_patch"
            chmod 600 "$backup_patch"
            echo "Local patch preserved outside checkout: $backup_patch"
            echo "Local patch SHA-256: $(sha256sum "$backup_patch" | awk '{print $1}')"
            git stash push -m "pre-deploy server changes ${TESTED_SHA:-manual}"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::Tracked changes remain after git stash; refusing to continue."
              exit 1
            fi
          else
            echo "No tracked local changes to preserve."
          fi

          git checkout main
          git pull --ff-only origin main
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "::error::Checked-out commit differs from the commit that passed CI"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "deploying_sha=$(git rev-parse --short HEAD)"

      - name: Rebuild and start services
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Apply database migrations
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Prisma schema and seed configuration live at /repo, not the API
          # image's default WORKDIR (/repo/apps/api).
          docker compose -f docker-compose.prod.yml exec -T -w /repo api npx prisma migrate deploy
          docker compose -f docker-compose.prod.yml exec -T -w /repo api npx prisma migrate status

      - name: Seed reference data (idempotent upsert)
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml exec -T -w /repo api npx prisma db seed

      - name: Health check
        if: steps.select_commit.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml ps
          curl -sf http://127.0.0.1/api/v1/health >/dev/null
          echo "DEPLOY OK"
