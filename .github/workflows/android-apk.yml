name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/new-bazaar-android-apk
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_CONFIGURED: env.RELEASE_SIGNING_CONFIGURED == 'true'
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release signing key
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SHAHRJO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shahrjo-release.jks"
          echo "SHAHRJO_KEYSTORE_PATH=$RUNNER_TEMP/shahrjo-release.jks" >> "$GITHUB_ENV"
          echo "SHAHRJO_KEYSTORE_PASSWORD=${{ secrets.SHAHRJO_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SHAHRJO_KEY_ALIAS=${{ secrets.SHAHRJO_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SHAHRJO_KEY_PASSWORD=${{ secrets.SHAHRJO_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        run: gradle assembleRelease

      - name: Upload release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shahrjo-bazaar-release-apk
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK if release signing is not configured
        if: env.RELEASE_SIGNING_CONFIGURED != 'true'
        run: gradle assembleDebug

      - name: Upload debug test APK
        if: env.RELEASE_SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shahrjo-bazaar-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
