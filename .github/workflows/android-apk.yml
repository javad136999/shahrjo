name: Android APK
# Rebuild requested: produce a fresh Bazaar APK with the official ShahrJo launcher icon.

on:
  workflow_dispatch:
  push:
    branches:
      - build/new-bazaar-android-apk
      - fix/bazaar-app-icon
    paths:
      - "android-wrapper/**"
      - "apps/web/public/icon-512x512.png"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use the web app's official launcher logo
        run: |
          test -s ../apps/web/public/icon-512x512.png
          mkdir -p app/src/main/res/mipmap-nodpi
          cp ../apps/web/public/icon-512x512.png app/src/main/res/mipmap-nodpi/ic_launcher.png
          test -s app/src/main/res/mipmap-nodpi/ic_launcher.png
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check release signing configuration
        id: signing
        env:
          STORE_B64: ${{ secrets.SHAHRJO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHAHRJO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHAHRJO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHAHRJO_KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SHAHRJO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shahrjo-release.jks"
          echo "SHAHRJO_KEYSTORE_PATH=$RUNNER_TEMP/shahrjo-release.jks" >> "$GITHUB_ENV"
          echo "SHAHRJO_KEYSTORE_PASSWORD=${{ secrets.SHAHRJO_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SHAHRJO_KEY_ALIAS=${{ secrets.SHAHRJO_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SHAHRJO_KEY_PASSWORD=${{ secrets.SHAHRJO_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle assembleRelease

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shahrjo-bazaar-release-apk
          path: android-wrapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK if release signing is not configured
        if: steps.signing.outputs.available != 'true'
        run: gradle assembleDebug

      - name: Upload debug test APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shahrjo-bazaar-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
